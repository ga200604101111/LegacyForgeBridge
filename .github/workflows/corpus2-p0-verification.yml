name: corpus2-p0-verification
on:
  push:
    branches: [ 'feature/generic-conversion-bamboo-corpus2' ]
permissions:
  contents: write
concurrency:
  group: corpus2-p0-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Apply checksum-verified source batch
        if: hashFiles('tools/apply-corpus2-p0.py') != ''
        run: python3 tools/apply-corpus2-p0.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Full build and tests
        run: gradle build --stacktrace
      - name: Save tested source snapshot
        shell: bash
        run: |
          set -euo pipefail
          git add -A src build.gradle tools
          if ! git diff --cached --quiet; then
            git diff --cached --check
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'feat: generic registry extraction and dormant-coremod handling for corpus2 P0 [skip ci]'
            git push origin HEAD:feature/generic-conversion-bamboo-corpus2
          fi
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: LegacyForgeBridge-corpus2-p0
          path: build/libs/*.jar
          if-no-files-found: error
