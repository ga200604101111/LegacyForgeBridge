name: corpus2-p0-verification
on:
  workflow_dispatch:
  push:
    branches:
      - feature/generic-conversion-bamboo-corpus2
permissions:
  contents: write
concurrency:
  group: corpus2-p0-${{ github.ref }}
  cancel-in-progress: true
jobs:
  transfer-complete-batch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 2
      - name: Commit the complete verified source batch without building
        run: python3 tools/rev181-transfer.py
