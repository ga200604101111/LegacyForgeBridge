name: corpus2-p0-verification
on:
  push:
    branches: [ 'feature/generic-conversion-bamboo-corpus2' ]
permissions:
  contents: write
concurrency:
  group: corpus2-p0-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply mimic / held-model source patch when not landed yet
        shell: bash
        run: |
          set -euo pipefail
          marker='2026-09-20.142-mimic-shapes'
          build_info='src/main/java/dev/yinghuang/legacyforgebridge/BuildInfo.java'
          if grep -q "$marker" "$build_info"; then
            echo "Mimic source patch already landed."
            exit 0
          fi

          cat .github/patches/mimic-shapes/part-*.patchfrag > /tmp/mimic-shapes.patch

          python3 - <<'PY'
          from pathlib import Path
          source = Path("/tmp/mimic-shapes.patch").read_text(encoding="utf-8")
          excluded = {
              "src/main/java/dev/yinghuang/legacyforgebridge/BuildInfo.java",
              "src/main/java/dev/yinghuang/legacyforgebridge/render/ConvertedGeometryClient.java",
          }
          chunks = source.split("diff --git ")
          kept = [chunks[0]]
          for chunk in chunks[1:]:
              first = chunk.splitlines()[0]
              left = first.split(" b/", 1)[0]
              path = left[2:] if left.startswith("a/") else left
              if path not in excluded:
                  kept.append("diff --git " + chunk)
          Path("/tmp/mimic-shapes-reduced.patch").write_text("".join(kept), encoding="utf-8")
          PY

          git apply --check /tmp/mimic-shapes-reduced.patch
          git apply /tmp/mimic-shapes-reduced.patch

          python3 - <<'PY'
          from pathlib import Path

          build = Path("src/main/java/dev/yinghuang/legacyforgebridge/BuildInfo.java")
          text = build.read_text(encoding="utf-8")
          old = 'public static final String CONVERTER_REVISION = "2026-09-20.142";'
          new = 'public static final String CONVERTER_REVISION = "2026-09-20.142-mimic-shapes";'
          if old not in text:
              raise SystemExit("BuildInfo revision baseline changed unexpectedly")
          build.write_text(text.replace(old, new, 1), encoding="utf-8")

          client = Path("src/main/java/dev/yinghuang/legacyforgebridge/render/ConvertedGeometryClient.java")
          text = client.read_text(encoding="utf-8")
          replacements = [
              ("import net.minecraft.tags.FluidTags;", "import net.minecraft.world.level.block.Blocks;"),
              (
                  'if(rule.pane()&&!variant.edges())faces=LegacyGeometry.curtainFaces(LegacyBlockGeometryRegistry.paneMask(world,pos,state));',
                  'if(rule.pane())faces=LegacyGeometry.paneFaces(LegacyBlockGeometryRegistry.paneMask(world,pos,state),variant.edges());'
              ),
              ("if(rule.mimic()){", "if(rule.mimic()&&variant.copyFace()>=0){"),
              (
                  "return result.isAir()||result.getFluidState().is(FluidTags.WATER)?null:new Target(target,result);",
                  "// A waterlogged solid is still a material source. Checking its fluid state would\n"
                  "        // incorrectly reject waterlogged stairs/slabs/panes as though the block were water.\n"
                  "        return result.isAir()||result.is(Blocks.WATER)?null:new Target(target,result);"
              ),
          ]
          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f"ConvertedGeometryClient baseline changed; missing: {old}")
              text = text.replace(old, new, 1)
          client.write_text(text, encoding="utf-8")

          report = Path("docs/mimic-shapes-validation-2026-09-20.json")
          if report.exists():
              text = report.read_text(encoding="utf-8").replace('"github_push_performed": false', '"github_push_performed": true')
              report.write_text(text, encoding="utf-8")
          doc = Path("docs/mimic-shapes-continuation-2026-09-20.md")
          if doc.exists():
              text = doc.read_text(encoding="utf-8")
              text = text.replace(
                  "尚未推送 GitHub、未執行完整 Gradle/JUnit suite、未完成 Minecraft 客戶端編譯與遊戲內驗收。",
                  "本修補將由 GitHub Actions 執行完整 Gradle/JUnit 建置；遊戲內驗收仍需實機確認。"
              )
              doc.write_text(text, encoding="utf-8")
          PY

          git diff --check

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Full build and tests
        run: gradle build --stacktrace

      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: LegacyForgeBridge-corpus2-p0
          path: build/libs/*.jar
          if-no-files-found: error

      - name: Commit verified source patch back to branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard docs src tools)" ]; then
            echo "No verified source changes to commit."
            exit 0
          fi
          git config user.name "LegacyForgeBridge CI"
          git config user.email "actions@users.noreply.github.com"
          git add docs src tools
          git diff --cached --check
          git commit -m "fix(render): preserve mimic shapes and 3D held block models"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Preserve reproducible offline presentation verification inputs
        if: always()
        run: |
          mkdir -p build/verification-support/source build/verification-support/lib
          git archive HEAD | tar -x -C build/verification-support/source
          for group in org.ow2.asm com.google.code.gson org.slf4j; do
            root="$HOME/.gradle/caches/modules-2/files-2.1/$group"
            if [ -d "$root" ]; then
              find "$root" -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' -exec cp -n {} build/verification-support/lib/ \;
            fi
          done

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: LegacyForgeBridge-verification-support
          path: |
            build/verification-support/
            build/test-results/test/*.xml
          retention-days: 7
          if-no-files-found: error
