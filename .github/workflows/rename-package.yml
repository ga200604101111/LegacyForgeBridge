name: rename-package-namespace

on:
  push:
    branches: [ rename-longyu-to-yinghuang ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  rename-and-verify:
    if: github.event_name == 'push' || github.event.pull_request.head.ref == 'rename-longyu-to-yinghuang'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: rename-longyu-to-yinghuang
          fetch-depth: 0

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 9.5.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'

      - name: Rename Java namespace and source paths
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/rename-package.yml')
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or path == workflow:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if 'longyu' in text:
                  path.write_text(text.replace('longyu', 'yinghuang'), encoding='utf-8')
          PY

          mkdir -p src/main/java/dev/yinghuang
          git mv src/main/java/dev/longyu/legacyforgebridge src/main/java/dev/yinghuang/legacyforgebridge
          rmdir src/main/java/dev/longyu

          mkdir -p src/test/java/dev/yinghuang
          git mv src/test/java/dev/longyu/legacyforgebridge src/test/java/dev/yinghuang/legacyforgebridge
          rmdir src/test/java/dev/longyu

          rm .github/workflows/rename-package.yml
          git add -A
          git diff --cached --check

          if git grep -n 'longyu' --cached -- .; then
            echo 'Found remaining longyu references after namespace rename.' >&2
            exit 1
          fi

          if git ls-files | grep -F 'longyu'; then
            echo 'Found remaining tracked paths containing longyu.' >&2
            exit 1
          fi

      - name: Build and test renamed namespace
        run: gradle build --stacktrace

      - name: Commit verified rename
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'refactor: rename package namespace from longyu to yinghuang'
          git push origin HEAD:rename-longyu-to-yinghuang
