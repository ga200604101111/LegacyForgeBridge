name: alpha25-verification
on:
  push:
    branches: [ 'verify/alpha25-rpgtool' ]
permissions:
  contents: read
concurrency:
  group: alpha25-verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.1'
      - name: Full build and tests
        run: gradle build --stacktrace
      - name: Export offline corpus verification kit
        if: always()
        run: gradle -I tools/verification.init.gradle exportVerificationKit --stacktrace
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: alpha25-verification-kit
          path: build/verification-kit/
          retention-days: 3
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: LegacyForgeBridge-alpha25
          path: build/libs/*.jar
          if-no-files-found: error
