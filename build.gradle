plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.group
base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { name = 'ViaVersion'; url = 'https://repo.viaversion.com' }
    maven { name = 'Lenni0451'; url = 'https://maven.lenni0451.net/everything' }
    maven { name = 'Terraformers'; url = 'https://maven.terraformersmc.com/releases' }
    maven {
        name = 'Jitpack'
        url = 'https://jitpack.io'
        content { includeGroup 'com.github.oryxel1' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // ViaFabricPlus is an external runtime mod. Only its public API is used at compile time.
    // 4.4.15 is the required runtime; the public API artifact currently available for this
    // API-v6 line is 4.4.14 and exposes the same methods used by LegacyForgeBridge.
    modCompileOnly "com.viaversion:viafabricplus-api:${project.viafabricplus_api_version}"

    // Fabric Loader 0.19.3 already supplies ASM 9.10.1 from the application class loader.
    // Never include/shade ASM inside this mod: doing so creates Knot/app ClassLoader conflicts
    // with Mixin, MixinExtras and preLaunch mods such as AsyncLogger.
    compileOnly 'org.ow2.asm:asm:9.10.1'
    compileOnly 'org.ow2.asm:asm-tree:9.10.1'
    compileOnly 'org.ow2.asm:asm-analysis:9.10.1'
    testImplementation 'org.ow2.asm:asm:9.10.1'
    testImplementation 'org.ow2.asm:asm-tree:9.10.1'
    testImplementation 'org.ow2.asm:asm-analysis:9.10.1'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

// The user supplied original 1.7.10 .lang files. Keep those filtered message sources in the
// repository, but generate modern JSON using collision-free LFB alias keys. This lets Minecraft's
// normal language stack select zh_tw/en_us while ensuring no 1.7.10 item/block/UI key can replace
// a same-named 1.21.11 translation globally.
def generatedLegacyLangDir = layout.buildDirectory.dir('generated/legacy-language-resources')

tasks.register('generateLegacyLanguageAliases') {
    inputs.files(fileTree('src/main/resources/assets/lfb-minecraft/legacy-lang') { include '**/*.lang' })
    inputs.files(fileTree('src/main/resources/assets/lfb-forge/legacy-lang') { include '**/*.lang' })
    outputs.dir(generatedLegacyLangDir)

    doLast {
        def parseParts = { File sourceDir, String aliasPrefix ->
            def translations = new LinkedHashMap<String, String>()
            if (!sourceDir.exists()) {
                return translations
            }

            fileTree(sourceDir).matching { include '*.lang' }.files.sort { it.name }.each { File langFile ->
                langFile.eachLine('UTF-8') { String line ->
                    if (line.isEmpty() || line.startsWith('#')) {
                        return
                    }
                    int separator = line.indexOf('=')
                    if (separator <= 0) {
                        return
                    }

                    String key = line.substring(0, separator)
                    String value = line.substring(separator + 1)
                    value = value.replaceAll(/%(\d+\$)?[\d.]*[df]/) { String whole, String index ->
                        '%' + (index ?: '') + 's'
                    }
                    translations.put(aliasPrefix + key, value)
                }
            }
            return translations
        }

        def writeLanguage = { String namespace, String language, String aliasPrefix ->
            File sourceDir = file("src/main/resources/assets/${namespace}/legacy-lang/${language}")
            def translations = parseParts(sourceDir, aliasPrefix)
            if (translations.isEmpty()) {
                return
            }

            File outputFile = generatedLegacyLangDir.get()
                    .file("assets/${namespace}/lang/${language}.json")
                    .asFile
            outputFile.parentFile.mkdirs()
            outputFile.setText(
                    groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(translations)) + '\n',
                    'UTF-8'
            )
        }

        ['en_us', 'zh_tw'].each { String language ->
            writeLanguage('lfb-minecraft', language, 'lfb.minecraft.')
            writeLanguage('lfb-forge', language, 'lfb.forge.')
        }
    }
}

processResources {
    dependsOn tasks.named('generateLegacyLanguageAliases')
    inputs.property 'version', project.version

    // Source .lang files are build inputs only. Ship the generated JSON aliases, not duplicate
    // runtime catalogues.
    exclude 'assets/lfb-minecraft/legacy-lang/**'
    exclude 'assets/lfb-forge/legacy-lang/**'
    from(generatedLegacyLangDir)

    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}

// Binary corpora are never committed. The normal unit-test task excludes exact external corpus
// tests; the dedicated task is fail-closed when explicitly requested without a pinned binary.
tasks.named('test', Test) {
    useJUnitPlatform {
        excludeTags 'exact-corpus'
    }
}

def exactCorpusJar = providers.gradleProperty('lfbExactCorpusJar')
        .orElse(providers.environmentVariable('LFB_EXACT_CORPUS_JAR'))

tasks.register('exactCorpusTest', Test) {
    group = 'verification'
    description = 'Runs checksum-pinned whole-JAR corpus regressions; fails if the external corpus is absent.'
    dependsOn tasks.named('testClasses')
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'exact-corpus'
    }
    doFirst {
        String corpus = exactCorpusJar.orNull
        if (corpus == null || corpus.isBlank()) {
            throw new GradleException('exactCorpusTest requires -PlfbExactCorpusJar=/path/to/Bamboo-2.6.8.5.jar or LFB_EXACT_CORPUS_JAR')
        }
        systemProperty 'lfb.exactCorpus.jar', corpus
    }
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.name}" }
    }
}

// Regression guard for Fabric class-loader safety. ASM is supplied by Fabric Loader and must
// never be nested or shaded into the final LegacyForgeBridge JAR.
tasks.register('verifyNoBundledAsm') {
    dependsOn tasks.named('remapJar')

    doLast {
        def outputJar = tasks.named('remapJar').get().archiveFile.get().asFile
        def forbidden = zipTree(outputJar).matching {
            include 'org/objectweb/asm/**'
            include 'META-INF/jars/asm-*.jar'
            include 'META-INF/jars/asm-tree-*.jar'
            include 'META-INF/jars/asm-analysis-*.jar'
            include 'META-INF/jars/asm-commons-*.jar'
            include 'META-INF/jars/asm-util-*.jar'
        }.files

        if (!forbidden.isEmpty()) {
            throw new GradleException("Final mod JAR must not bundle ASM; Fabric Loader provides it. Found: ${forbidden*.name}")
        }
    }
}

// The shipped mod namespace is dev.yinghuang. Catch any stale package path or class/resource
// constant before an artifact can be published.
tasks.register('verifyNoLongyuNamespace') {
    dependsOn tasks.named('remapJar')

    doLast {
        File outputJar = tasks.named('remapJar').get().archiveFile.get().asFile
        def offenders = []
        def zip = new java.util.zip.ZipFile(outputJar)
        try {
            zip.entries().each { entry ->
                if (entry.name.contains('longyu')) {
                    offenders.add(entry.name)
                    return
                }
                if (!entry.directory) {
                    byte[] bytes = zip.getInputStream(entry).bytes
                    String raw = new String(bytes, java.nio.charset.StandardCharsets.ISO_8859_1)
                    if (raw.contains('dev.yinghuang') || raw.contains('dev/yinghuang')) {
                        offenders.add(entry.name)
                    }
                }
            }
        } finally {
            zip.close()
        }
        if (!offenders.isEmpty()) {
            throw new GradleException("Final mod JAR still contains the retired longyu namespace: ${offenders}")
        }
    }
}

tasks.named('build') {
    dependsOn tasks.named('verifyNoBundledAsm')
    dependsOn tasks.named('verifyNoLongyuNamespace')
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            from components.java
        }
    }
}
