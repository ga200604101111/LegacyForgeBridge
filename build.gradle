plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.group
base {
    archivesName = project.archives_base_name
}

repositories {
    mavenCentral()
    maven { name = 'ViaVersion'; url = 'https://repo.viaversion.com' }
    maven { name = 'Lenni0451'; url = 'https://maven.lenni0451.net/everything' }
    maven { name = 'Terraformers'; url = 'https://maven.terraformersmc.com/releases' }
    maven {
        name = 'Jitpack'
        url = 'https://jitpack.io'
        content { includeGroup 'com.github.oryxel1' }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // ViaFabricPlus is an external runtime mod. Only its public API is used at compile time.
    // 4.4.15 is the required runtime; the public API artifact currently available for this
    // API-v6 line is 4.4.14 and exposes the same methods used by LegacyForgeBridge.
    modCompileOnly "com.viaversion:viafabricplus-api:${project.viafabricplus_api_version}"

    // Fabric Loader 0.19.3 already supplies ASM 9.10.1 from the application class loader.
    // Never include/shade ASM inside this mod: doing so creates Knot/app ClassLoader conflicts
    // with Mixin, MixinExtras and preLaunch mods such as AsyncLogger.
    compileOnly 'org.ow2.asm:asm:9.10.1'
    testImplementation 'org.ow2.asm:asm:9.10.1'

    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') {
        expand 'version': project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = 21
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    testLogging {
        events 'passed', 'skipped', 'failed'
        exceptionFormat = 'full'
    }
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    from('LICENSE') {
        rename { "${it}_${project.name}" }
    }
}

// Regression guard for Fabric class-loader safety. ASM is supplied by Fabric Loader and must
// never be nested or shaded into the final LegacyForgeBridge JAR.
tasks.register('verifyNoBundledAsm') {
    dependsOn tasks.named('remapJar')

    doLast {
        def outputJar = tasks.named('remapJar').get().archiveFile.get().asFile
        def forbidden = zipTree(outputJar).matching {
            include 'org/objectweb/asm/**'
            include 'META-INF/jars/asm-*.jar'
            include 'META-INF/jars/asm-tree-*.jar'
            include 'META-INF/jars/asm-analysis-*.jar'
            include 'META-INF/jars/asm-commons-*.jar'
            include 'META-INF/jars/asm-util-*.jar'
        }.files

        if (!forbidden.isEmpty()) {
            throw new GradleException("Final mod JAR must not bundle ASM; Fabric Loader provides it. Found: ${forbidden*.name}")
        }
    }
}

tasks.named('build') {
    dependsOn tasks.named('verifyNoBundledAsm')
}

publishing {
    publications {
        create('mavenJava', MavenPublication) {
            from components.java
        }
    }
}
